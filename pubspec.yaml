name: kinnect
description: AI supported social media app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- MÜZİK SERVİSLERİ ---
  http: ^1.2.0           # Spotify & Apple Music API istekleri için
  url_launcher: ^6.2.5   # Spotify uygulamasını açmak için
  app_links: ^6.3.0      # Deep linking

  # --- SES VE VİDEO (MEDYA) ---
  record: ^6.0.0         # Ses kaydı (Zego ile uyumlu olması için senin sürümüne döndüm)
  audioplayers: ^6.0.0   # Ses çalma
  video_player: ^2.9.0   # 🎥 YENİ: Live Video oynatmak için gerekli!
  path_provider: ^2.1.2
  image: ^4.1.7          # 📸 Selfie flip için
  permission_handler: ^12.0.1 # ✅ DÜZELTİLDİ: Zego için sürüm yükseltildi

  # --- KİMLİK DOĞRULAMA ---
  google_sign_in: ^6.2.1

  # --- YARDIMCILAR ---
  intl: ^0.19.0
  timeago: ^3.6.1
  shared_preferences: ^2.2.2  # Photo Emoji yerel depolama için

  # --- TASARIM & İKONLAR ---
  font_awesome_flutter: ^10.6.0
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

  # --- BACKEND ---
  supabase_flutter: ^2.8.0

  # --- FIREBASE (Push Notifications) ---
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6

  # --- EKRANLAR ---
  introduction_screen: ^3.1.14

  # --- RESİM & DOSYA ---
  image_picker: ^1.0.7
  cached_network_image: ^3.4.1

  # --- ZEGO CLOUD (ARAMA & GÖRÜNTÜLÜ SOHBET) ---
  zego_uikit: ^2.28.35
  zego_uikit_prebuilt_call: ^4.22.1
  zego_uikit_signaling_plugin: ^2.8.19
  country_code_picker: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # --- İKON DEĞİŞTİRME PAKETİ ---
  flutter_launcher_icons: ^0.13.1

  # --- SPLASH SCREEN ---
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true

  # Resim vb. varlıklar
  assets:
    - assets/icon/
    - assets/badges/

# --- İKON AYARLARI ---
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

# --- SPLASH SCREEN AYARLARI ---
# Sadece koyu arka plan - logo Flutter splash'ta gösterilecek
flutter_native_splash:
  color: "#06060A"
  color_dark: "#06060A"
  android_12:
    color: "#06060A"
  ios: true
  android: true
  web: false
  # Logo yok - sadece koyu arka plan