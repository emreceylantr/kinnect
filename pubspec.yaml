name: kinnect
description: AI supported social media app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- MÜZİK SERVİSLERİ (YENİ EKLENENLER) ---
  http: ^1.2.0           # Spotify & Apple Music API istekleri için
  url_launcher: ^6.2.5   # Spotify uygulamasını açmak için

  # --- SESLİ MESAJ İÇİN GEREKLİLER ---
  record: ^6.0.0
  audioplayers: ^6.0.0   # Apple Music 30sn önizleme burada çalacak
  path_provider: ^2.1.2
  permission_handler: ^12.0.1

  # --- KİMLİK DOĞRULAMA ---
  google_sign_in: ^6.2.1

  # --- YARDIMCILAR ---
  intl: ^0.19.0
  timeago: ^3.6.1

  # --- TASARIM & İKONLAR ---
  font_awesome_flutter: ^10.6.0
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

  # --- BACKEND ---
  supabase_flutter: ^2.8.0

  # --- EKRANLAR ---
  introduction_screen: ^3.1.14

  # --- MEDYA ---
  image_picker: ^1.0.7

  # --- ZEGO CLOUD (ARAMA & GÖRÜNTÜLÜ SOHBET) ---
  zego_uikit: ^2.28.35
  zego_uikit_prebuilt_call: ^4.22.1
  zego_uikit_signaling_plugin: ^2.8.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # --- İKON DEĞİŞTİRME PAKETİ ---
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

# --- İKON AYARLARI ---
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true